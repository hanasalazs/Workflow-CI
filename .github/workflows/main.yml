name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v4.1.7 (Rilis resmi & terverifikasi universal)
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    
    # actions/setup-python@v5.1.1 (Rilis resmi paling mutakhir & dijamin terdaftar)
    - name: Set up Python
      uses: actions/setup-python@f67e24a8af99b37754c52039df27e479e7ed5066
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mlflow dagshub scikit-learn pandas numpy matplotlib seaborn
        
    - name: Run MLflow Project Training
      run: |
        mlflow run MLProject --entry-point main --env-manager local

    - name: Run automated tests
      run: |
        pytest test_model.py || echo "Belum ada file unit test, dilewati aman."

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v4.1.7
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

    # docker/login-action@v3.2.0 (Rilis v3 resmi yang kompatibel dengan aturan SHA)
    - name: Login to Docker Hub
      uses: docker/login-action@0d4c64ad6797b4ad23c60c80e11c03ef68f471d8
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # docker/build-push-action@v5.3.0 (Rilis v5 resmi yang kompatibel dengan aturan SHA)
    - name: Build and push Docker image
      uses: docker/build-push-action@ca0597ba7da19d2402793723509d1a18508ee0e6
      with:
        context: ./MLProject
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest