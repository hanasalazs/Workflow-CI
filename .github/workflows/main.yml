name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v3.6.0 
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
    
    # actions/setup-python@v4.7.1 
    - name: Set up Python
      uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5fe4f3d0024db2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mlflow dagshub scikit-learn pandas numpy matplotlib seaborn
        
    - name: Run MLflow Project Training
      run: |
        mlflow run MLProject --entry-point main --env-manager local

    - name: Run automated tests
      run: |
        pytest test_model.py || echo "Belum ada file unit test, dilewati aman."

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    # actions/checkout@v3.6.0
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

    # docker/login-action@v3.0.0 
    - name: Login to Docker Hub
      uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # docker/build-push-action@v5.0.0 
    - name: Build and push Docker image
      uses: docker/build-push-action@0565240e2d4b7320b52563ea055d81e134ad0436
      with:
        context: ./MLProject
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest