name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    # Menggunakan SHA resmi actions/checkout@v4
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
    
    # Menggunakan SHA resmi actions/setup-python@v4 (Versi yang lolos di run #7 kamu!)
    - name: Set up Python
      uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5fe4f3d0024db2
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest mlflow dagshub scikit-learn pandas numpy matplotlib seaborn
        
    - name: Run MLflow Project Training
      run: |
        mlflow run MLProject --entry-point main --env-manager local

    - name: Run automated tests
      run: |
        pytest test_model.py || echo "Belum ada file unit test, dilewati aman."

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    # Menggunakan SHA resmi actions/checkout@v4
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

    # Menggunakan SHA resmi docker/login-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@0d4c64ad6797b4ad23c60c80e11c03ef68f471d8
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Menggunakan SHA resmi docker/build-push-action@v5
    - name: Build and push Docker image
      uses: docker/build-push-action@ca0597ba7da19d2402793723509d1a18508ee0e6
      with:
        context: ./MLProject
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/workflow-ci:latest